<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 365" width="880" height="365" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Inter', sans-serif">
